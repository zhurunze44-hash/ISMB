name: Paper3 public structural reproducibility smoke

on:
  push:
    branches: [main]
    paths:
      - 'ISMB/**'
      - '.github/workflows/reproduction-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ISMB
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable release files before downloading data
        run: python tools/verify_release.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Download and verify public pinned human inputs
        run: python tools/prepare_inputs.py --download
      - name: Recompute bounded R8 R9 R10 smoke
        run: python tools/run_smoke.py
      - name: Upload evidence if available
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper3-structural-smoke-results
          path: ISMB/smoke_logs/
          if-no-files-found: ignore
